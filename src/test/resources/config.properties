# Default framework configuration.
# Every value can be overridden at runtime with a -D system property of the same key,
# e.g.  mvn test -Dplatform=ios -Dappium.server.url=http://127.0.0.1:4723

# android | ios
platform=android

# Appium server
appium.server.url=http://127.0.0.1:4723

# Explicit + implicit wait budgets (seconds)
explicit.wait.seconds=20
implicit.wait.seconds=0

# ---- Android capabilities ----
android.deviceName=emulator-5554
android.platformVersion=14
android.app=
android.appPackage=io.appium.flutterintegration
android.appActivity=.MainActivity
android.automationName=Flutter

# ---- iOS capabilities ----
ios.deviceName=iPhone 15
ios.platformVersion=17.5
ios.app=
ios.bundleId=io.appium.flutterIntegrationApp
ios.automationName=Flutter
